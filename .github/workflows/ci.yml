name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  schema-gate:
    name: Schema Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator dependencies
        run: pip install pyyaml jsonschema

      - name: Validate requirements.yaml against req-schema.json
        run: python scripts/validate_requirements.py

  offline-test-gate:
    name: Offline Test Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run offline test suite
        run: pytest test/offline -v

  static-analysis-gate:
    name: Static Analysis Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install "ruff>=0.16"

      - name: Ruff check
        run: ruff check src/
