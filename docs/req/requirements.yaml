schema_version: 1
owner: "60211808"
frozen_at: "2026-11-17"
baseline_repo: "https://github.com/tauricresearch/tradingagents"
baseline_commit: "9fa1196fffbcfd9de5146d2dd2869df84ab99838"
tradeoff: >
  Ten requirements, all Must, covering functional / invariant / cost / governance.
  Deliberately excluded, with reasons: wall-clock latency budget (COST-06 in the agent
  session) because the repository defines no latency target and the notes give no
  duration, so any threshold would be invented; decision-quality regression (COST-07)
  because no labelled baseline exists to compare against. Both are recorded as rejected
  rather than silently dropped. Security (input sanitisation) and quality attribute
  (reproducibility) coverage are deferred; ids will be added, never renumbered, if time
  allows.

requirements:

  - id: FR-01
    type: functional
    statement: >
      The research debate shall run in two phases: bull and bear each produce structured
      idea cards under Osborn's rules (defer judgement, pursue quantity, build on others,
      combine and improve), and the Research Manager shall adjudicate from those cards.
    fit_criterion:
      metric: "idea cards produced per side; required fields present; whether the rationale cites card ids"
      threshold: ">=1 card per side; every card carries claim/evidence/stance/uncertainty; rationale cites >=1 card id; 100% of 10 sampled runs"
      verification: "schema-validate the saved debate record, then match citation ids in the rationale"
    priority: must
    source: "notes/three-changes.md goal 2; tradingagents/agents/state.py (InvestDebateState)"

  - id: FR-02
    type: functional
    statement: >
      The debate shall terminate when it converges or when max_debate_rounds is reached,
      and shall record the convergence round count and the termination reason.
    fit_criterion:
      metric: "presence of convergence_rounds and termination_reason; runs exceeding the cap"
      threshold: "100% of records carry both fields; 0 runs exceed max_debate_rounds"
      verification: "assert both fields in investment_debate_state; then run once with max_debate_rounds=0 and assert immediate termination with a recorded reason"
    priority: must
    source: "tradingagents/default_config.py (max_debate_rounds: 1); tradingagents/agents/state.py (InvestDebateState.count)"

  - id: FR-03
    type: functional
    statement: >
      A single-ticker analysis shall emit a structured final decision carrying the rating,
      an executive summary, the investment thesis, and the key evidence items the decision
      cites.
    fit_criterion:
      metric: "completeness of the four fields across sampled runs"
      threshold: "100% of 10 sampled runs carry all four fields with non-empty evidence citations; 0 missing"
      verification: "schema-validate the saved decision record"
    priority: must
    source: "tradingagents/agents/schemas.py (PortfolioDecision); tradingagents/agents/state.py (final_trade_decision)"

  - id: FR-04
    type: functional
    statement: >
      The system shall meter token usage per agent per LLM call (input, output, total) and
      expose the aggregate programmatically at the end of a run, not only through the CLI
      display.
    fit_criterion:
      metric: "share of LLM calls with a token record; aggregate minus sum of items"
      threshold: "100% of calls recorded; absolute(aggregate - sum(items)) == 0"
      verification: "run one analysis, export per-call records and the aggregate, compare sums"
    priority: must
    source: "notes/three-changes.md goal 1; tradingagents/cli/stats_handler.py (CLI-facing today; confirm programmatic export)"

  - id: FR-05
    type: functional
    statement: >
      Every final decision shall pass a deterministic guard checkpoint before any
      downstream consumer reads it; a decision that fails the guard shall not be published.
    fit_criterion:
      metric: "share of decisions traversing the guard; bypass paths"
      threshold: "100% traverse it (visible in the run trace); 0 bypass paths"
      verification: "static check that the output node is reachable only through the gate node; runtime assertion of gate execution"
    priority: must
    source: "notes/three-changes.md goal 3"

  - id: INV-01
    type: invariant
    statement: >
      final_rating shall be one of Buy / Overweight / Hold / Underweight / Sell / REVIEW;
      REVIEW shall never be consumed downstream as a tradeable position; and the guard's
      pass/fail decision shall involve no LLM call.
    fit_criterion:
      metric: "out-of-enum values reaching final_rating; REVIEW mapped to a position; LLM calls inside the gate path"
      threshold: "all three are 0"
      verification: "inject 'Strong Buy', 'overweight plus', and an empty string into the free-text rating path and assert is_review is True; assert the position mapper raises or skips on REVIEW; static inspection that the gate body contains no LLM or structured-invoke call"
    priority: must
    protects: "the existing RATING_REVIEW fail-safe in tradingagents/agents/rating.py, where parse_rating defaults to REVIEW rather than degrading to Hold"
    source: "tradingagents/agents/rating.py (RATINGS_5_TIER, RATING_REVIEW, parse_rating default, is_review); tradingagents/agents/schemas.py (PortfolioRating); tradingagents/agents/state.py (final_rating)"

  - id: INV-02
    type: invariant
    statement: >
      The suggested position size shall parse to a percentage of the portfolio and shall
      not exceed the configured cap; a size that cannot be parsed shall resolve to REVIEW,
      never to a default position.
    fit_criterion:
      metric: "over-cap and unparseable position sizes that pass the guard"
      threshold: "0 pass; 100% are rejected or resolve to REVIEW"
      verification: "unit-test the gate with '80% of portfolio', 'all in', '1.5x leverage' and an empty string (all must be blocked), plus '12% of portfolio' against a 10% cap (must be blocked)"
    priority: must
    source: "tradingagents/agents/schemas.py:180 (position_sizing: str | None, free text, no numeric validator)"

  - id: INV-03
    type: invariant
    statement: >
      At the decision layer, when any key input's as-of date differs from the analysis
      trade_date, the run shall resolve to REVIEW and shall not continue on stale data.
    fit_criterion:
      metric: "tradeable decisions emitted on date-mismatched inputs"
      threshold: "0; 100% of mismatched runs resolve to REVIEW"
      verification: "build a date-mismatch fixture (1 day and 7 days old) and assert final_rating is REVIEW"
    priority: must
    source: "tradingagents/dataflows/date_window.py (as_of clamps future data only, not stale data); tradingagents/agents/state.py (trade_date)"

  - id: COST-01
    type: cost
    statement: >
      A single-ticker analysis shall run with max_tool_rounds = 8, news_article_limit = 8,
      and three global news queries, and a ten-run batch on the same ticker and date shall
      have both a lower mean and a lower median total token usage than the active pre-change
      baseline, using only runs whose data-fetch integrity preconditions hold.
    fit_criterion:
      metric: "effective config values; ten-run batch mean and median total tokens versus the active baseline; per-run data-fetch integrity of the After batch"
      threshold: "the three config values equal 8 / 8 / 3; over ten VALID After runs on NVDA / 2026-11-19 the batch mean total token count is < 160315.8 and the batch median is < 159615; each sample must pass the After data-integrity preconditions below"
      verification: "assert build_default_config() returns 8 / 8 / 3 (satisfied on main since 2026-11-20; see test/offline/test_config_cost.py); the After batch runs under the baseline protocol (temperature 0.0, analysts market+news, one research round, one risk round, isolated memory/cache/results), and per run the After data-integrity preconditions are asserted before the run may enter the batch; the batch mean and median of usage.total_tokens are then compared against the active 2026-11-19 baseline. The 2026-11-20 After batch (ten valid runs, mean 147754.2, median 148087) satisfies both comparisons. Articles fetched (ticker and global) are recorded per run as an explanatory covariate, not a threshold."
    priority: must

    baseline_date: "2026-11-19"
    baseline_status: active
    baseline_ticker: "NVDA"
    baseline_valid_runs: 10
    baseline_mean_total_tokens: 160315.8
    baseline_median_total_tokens: 159615
    baseline_min_total_tokens: 145545
    baseline_max_total_tokens: 174399
    baseline: "mean total_tokens = 160315.8 (median 159615, min 145545, max 174399) over 10 valid Before runs on NVDA / 2026-11-19, analysts market+news, temperature 0.0, model CS5351/DeepSeek-V4-Flash, config 20 / 20 / 5, seven-day ticker news window anchored to the analysis date; raw records in docs/evidence/cost01-2026-11-19/records/before/, each record carrying the code version it ran on."
    baseline_median: 159615
    baseline_run_ids:
      - "20261120_031930_7ee093c9"
      - "20261120_032527_a9e526a1"
      - "20261120_032743_94d1daf7"
      - "20261120_032937_ca79330f"
      - "20261120_033139_ca7050f0"
      - "20261120_033355_9a8b9c5e"
      - "20261120_033610_a896801f"
      - "20261120_033805_8874d79d"
      - "20261120_114222_f2932b46"
      - "20261120_114441_2a33e022"
    baseline_evidence_dir: "docs/evidence/cost01-2026-11-19/records/before/"
    baseline_supplements:
      - run_id: "20261120_114222_f2932b46"
        total_tokens: 173115
        replaces: "20261120_032135_28a781b6"
        reason: >
          The replaced run failed the market_rows precondition (141 rows against a 252-row
          requested window), so it could not enter the batch. The supplement was run on the
          same ticker and analysis date under the same protocol; its market evidence is
          committed under docs/evidence/cost01-2026-11-19/supplement/market_evidence/.
      - run_id: "20261120_114441_2a33e022"
        total_tokens: 164203
        replaces: "20261120_032332_fe83feb4"
        reason: >
          Same failure and same remedy as the entry above.
    baseline_excluded:
      - run_id: "20261120_032135_28a781b6"
        reason: "market_rows = 141 against a 252-row requested window; retained as a record, replaced by a same-protocol supplement, never counted as a valid sample."
      - run_id: "20261120_032332_fe83feb4"
        reason: "market_rows = 141 against a 252-row requested window; retained as a record, replaced by a same-protocol supplement, never counted as a valid sample."
    baseline_observations: >
      Ten valid runs on NVDA / 2026-11-19, config 20 / 20 / 5, all succeeded with
      data_fetch.complete = true and complete usage. Two of the twelve records failed the
      market_rows precondition and were replaced by same-protocol supplements, so the batch
      is ten supplemented runs, not the first ten recorded. The batch mean (160315.8) sits
      2.03% below the 2026-11-18 mean (163633.2) at identical config values, which is
      consistent with the ticker news window being anchored to the analysis date and not
      with any config change; the two batches are therefore separate baselines, not a
      Before/After pair, and must not be compared as a cost result.

    baseline_superseded:
      - baseline_date: "2026-11-18"
        baseline_status: superseded
        baseline_mean_total_tokens: 163633.2
        baseline_median: 160664
        baseline_min_total_tokens: 140232
        baseline_max_total_tokens: 196055
        baseline_valid_runs: 10
        baseline: "mean total_tokens = 163633.2 over 10 valid runs on NVDA / 2026-11-18, analysts market+news, model CS5351/DeepSeek-V4-Flash, commit 9fa1196, config 20 / 20 / 5, no news-window anchoring"
        evidence_ref: "c-baseline-work/results/ (Workstream C, local); not committed, so the figures cannot be recomputed from a clone"
        superseded_reason: >
          Superseded by the 2026-11-19 baseline, which holds the same ticker and the same
          config values but anchors the ticker news window to the analysis date. The two
          are not comparable as a cost result because the input window changed. The
          2026-11-18 batch is retained unchanged for audit, not deleted and not restated.
        replaced_by: "2026-11-19"
      - baseline_date: "2026-09-01"
        baseline_status: superseded
        baseline_mean_total_tokens: 108901.0
        baseline_median: 92713
        baseline_min_total_tokens: 80968
        baseline_max_total_tokens: 167483
        baseline_valid_runs: 10
        baseline: "mean total_tokens = 108901.0 over 10 valid baseline runs (measured by C on D1, commit 9fa1196, NVDA/2026-09-01, analysts market+news, model CS5351/DeepSeek-V4-Flash)"
        evidence_ref: "c-baseline-work/results/summary.json (Workstream C, local); raw 2026-09-01 records retained, not deleted or modified."
        superseded_reason: >
          Withdrawn as an active baseline because the record set lacks sufficient
          data_fetch completeness evidence: the 2026-09-01 runs carry no data_fetch
          status, so Market/News input completeness cannot be verified, and Yahoo news
          cannot reach a window ~78 days in the past. The evidence is retained unchanged
          for audit. Superseded by the 2026-11-18 baseline above, which is itself now superseded by the 2026-11-19 baseline.
        replaced_by: "2026-11-18"
        old_vs_new_difference_pct: 50.3
        difference_note: >
          New-vs-old batch mean differs by about 50.3% (163633.2 vs 108901.0). This is
          NOT an optimization effect and NOT evidence that either batch is cheaper: the
          withdrawn batch had unverifiable data completeness, so the token difference
          reflects differing/unsafe input completeness, not a cost improvement. The two
          batches must not be mixed or compared as a cost result.

    # After-side data-integrity preconditions (per run, not batch-level). A run that
    # fails ANY of these is invalid and must be kept (with its failure reason) but
    # MUST NOT enter the After batch statistics, even if its token count is lower.
    after_integrity_preconditions:
      - data_fetch.complete == true
      - market_rows equals the row count of the requested range (252 or 264)
      - ticker news delivered_count > 0 (non-empty)
      - global news delivered_count > 0 (non-empty)
    after_integrity_note: >
      Checked individually for every After run, not only in the batch aggregate. Invalid
      runs (failed or failed-precondition) are retained as records and never counted as
      valid samples; a lower token count caused by missing/failed data acquisition must
      never be treated as a valid cost reduction.

    comparison_rules:
      - "Baseline and After must share the same ticker, the same trade_date, and the same data-integrity requirements."
      - "Token statistics use only records that satisfy the validity conditions."
      - "After runs from different code versions must not be mixed into one batch."
      - "Reduced token usage caused by reduced/failed data acquisition is not a valid cost reduction."
      - "Before and After must share the same protocol except for the config values under test; a change to the data window creates a new baseline, it does not create a Before/After pair."
      - "A supplemented run counts once in the batch; the run it replaces is retained as an excluded record and is never counted."

    amended: "2026-11-18, after the baseline measurement and after PR #2 was merged. Removed the unfalsifiable 'every observed tool-call count and article count is within those limits' clause (observed tool_rounds were 3-5 against a cap of 8, so it held by construction as rounds, while observed tool_calls were 12-25 because calls run in parallel within a round, so it could never hold as calls). Replaced the per-run 'strictly below baseline' clause with a ten-run batch comparison on mean and median because the baseline distribution was bimodal (7 runs at 80968-94687, 3 runs at 146263-167483 with 22-25 tool calls), making individual-run comparison unstable. 2026-11-19: with B's approval, the active baseline date changed from 2026-09-01 to 2026-11-18 (10 valid runs, mean 163633.2, median 160664); the 2026-09-01 batch is retained and marked superseded (insufficient data_fetch integrity evidence) rather than deleted. Added per-run After data-integrity preconditions (data_fetch.complete, market_rows==252, non-empty ticker/global news) and comparison rules forbidding mixing code versions or counting data-loss as cost reduction. 2026-11-21: the active baseline moved from 2026-11-18 to 2026-11-19, measured under the same config values but with the ticker news window anchored to the analysis date, so the baseline now shares the protocol the After batch is measured under. Two Before runs failed the market_rows precondition (141 rows against a 252-row window) and were replaced by same-protocol supplement runs committed under docs/evidence/cost01-2026-11-19/; the replaced runs are retained as excluded records. The market_rows precondition now reads 'equals the row count of the requested range' so a 264-row window is not treated as a failure. The 2026-11-18 batch is retained and marked superseded rather than deleted."
    source: "src/tradingagents/default_config.py (max_tool_rounds: 8, news_article_limit: 8, global_news_queries: 3 items); notes/three-changes.md goal 1; docs/evidence/cost01-2026-11-19/ (2026-11-19 Before batch, 12 records of which 10 valid); docs/evidence/cost01-2026-11-19/records/after/ (2026-11-20 After batch)"

  - id: GOV-01
    type: governance
    statement: >
      Every final decision record shall carry the prompt version, model identifier, rule
      version and input evidence fingerprint in force at the time of the decision, written
      in the same commit as the decision.
    fit_criterion:
      metric: "presence and non-emptiness of the four provenance fields"
      threshold: "100% of records carry all four; 0 missing"
      verification: "read the records after 10 runs and assert all four; then delete one field in a fixture and assert the write is refused"
    priority: must
    source: "notes/three-changes.md; tradingagents/memory/log.py (existing decision log to extend); prompts/prompt_v1.0.yaml (version source)"
